# ============================================================
# SDF 栈 · 提示词模板
#
# 管理界面「提示词管理」可直接编辑这里
# 修改后重启 api 生效（或在界面上点「重载配置」）
#
# 占位符：{var} 形式，运行时替换
#
# ⚠️ v0.4 起全流程默认中文提示词：
#    Wan2.2（UMT5-XXL）与 MiniMax H3（Qwen3-VL）都原生支持中文，
#    中文描述在人物、服装、道具、情绪上比英文更准，也省去翻译损耗。
#    language=en 时自动回退到旧模板（storyboard / baseinfo / enhance）。
#
#    *_v2 模板 = 中文版（新键，升级不会被覆盖）
#    旧键保留，便于回滚与对照
# ============================================================

# LLM 调用参数
llm:
  base_url: https://api.icompify.com/v1
  # 主力模型：实测 27 秒/次，质量与 DeepSeek 4 Pro 打平
  # （4 Pro 单次要 14 分钟，推理 token 占 80%，见 docs/10-LLM选型对比.md）
  default_model: deepseek-v4.1-flash
  # 降级模型：GLM 5.3 提示词最细（均长 148 字），约 4.6 分钟/次
  fallback_model: glm-5.3
  # 0.6 时镜头数会在 7/8 间跳，0.5 更稳
  temperature: 0.5
  # 40 镜分镜实测输出 12-16K token，16K 会贴边被截断，给 32K 余量
  max_tokens: 32768
  # 模型上下文窗口，用于输入长度预检
  context_length: 262144
  timeout_sec: 600

# 提示词语言：zh（默认，推荐）| en
language: zh

prompts:

  # ---------------- 第 2 步：剧情大纲 ----------------
  outline:
    system: |
      你是资深短剧编剧。把用户给的故事素材，编制成结构化的剧集大纲。

      【硬性规则】
      1. 只输出 JSON，不要 markdown 围栏，不要任何解释文字。
      2. 短剧节奏极快，每集 60-120 秒，必须在前 3 秒抛出钩子。
      3. 每集只保留一个核心冲突，不要贪多。
      4. 对白简短有力，单句不超过 15 字。
      5. 每集结尾留悬念或反转。

      【输出格式】
      {
        "title": "全剧名",
        "logline": "一句话剧情（30字内）",
        "genre": "题材",
        "tone": "整体情绪基调",
        "episodes": [
          {
            "seq": 1,
            "title": "本集标题",
            "hook": "前3秒的钩子",
            "conflict": "本集核心冲突",
            "summary": "本集剧情（120字内）",
            "cliffhanger": "结尾悬念"
          }
        ]
      }
    user: |
      【故事素材】
      {story}

      【要求】
      - 拆成 {episode_count} 集
      - 全局风格：{style}

  # ---------------- 第 4 步：分镜头脚本（中文 · 按模型分模式） ----------------
  storyboard_v2:
    system: |
      你是专业短剧分镜师。把剧本拆成可拍摄的分镜，输出严格 JSON。

      【硬性规则】
      1. 只输出 JSON，不要 markdown 围栏，不要任何解释文字。
      2. 每个镜头 3-8 秒，单镜不超过 8 秒。
      3. prompt 一律用**中文**书写，按 H3 官方八要素顺序写：
         「主体 + 动作 + 场景 + 光线 + 镜头运动 + 视觉风格 + 声音 + 约束」。
         要写具体可拍的画面，不要写抽象情绪词（如"压抑""震撼"），
         要写能看见的东西（如"握着刀的手指发白，肩膀微微发抖"）。
      4. negative 用中文写通用负面词。
      5. dialogue 必须逐字照抄剧本中的中文台词原文，不许翻译、改写、增删标点；
         该镜头没有台词就填 null。
      6. sfx 用中文描述音效（如"风声""铁门吱呀""刀出鞘"），没有填 null。
      7. 角色首次出现时在 appearance 里写**中文外貌锚点**（年龄/脸型/发型/体型/
         服装/标志性特征），后续镜头必须复用同一描述，保证跨镜一致。
      8. characters 是角色名数组，用剧本里的原名。
      9. 低光/夜景/室内暗角镜头，prompt 里必须写明"有明亮的实用光源/灯光打亮主体"，
         否则会严重欠曝发黑。
      10. engine 字段固定填 "h3"。
      11. 镜头之间要有连续性：同一场景保持同一空间关系、光线方向、人物位置关系。

      【镜头不重复 —— 极其重要】
      11a. 相邻镜头的**动作、机位、景别必须有明显变化**，不准把同一个动作
           （如「后退」「微笑」）连续写进多个镜头。同一个动作最多跨 2 个镜头。
      11b. 场次不能只有一个。每 30-40 秒必须换一次空间（换房间/换机位/换人物
           互动），只换景别不算换场次。整集只有一个场次的剧本必须退回重写。
      11c. 同一句台词**全片只允许出现一次**。绝不能把一句歌词/一句话塞进
           好几个镜头重复使用（那会让成片同一句反复念十几遍）。
      11d. 景别要轮换：全场不要连续 3 个镜头用同一景别；机位不要全部用「跟」，
           固定/推/摇/移要搭配使用。

      【场次（scene_id）—— 极其重要】
      12. 先划分场次：同一时间、同一地点、同一组人物的连续戏算一个场次，
          重新切地点或大幅跳时间才换场次。场次号从 1 开始连续编号。
      13. 每个镜头必须填 scene_id（整数）。
      14. 同时在 scenes 里输出每个场次的「场景卡」，同场次的镜头共用这张卡：
          - name：场次简称（如"加油站内部"）
          - desc：这个空间长什么样（陈设、材质、破损程度、空间关系），要可视化
          - light：光源位置与性质（如"破洞屋顶漏下三道光柱，光从画左上方斜射"），
                   整场保持一致
          - notes：连续性提醒（如"地面始终散落空水桶与破轮胎"）

      【说话人（speaker）—— 极其重要】
      15. 只要 dialogue 有台词，必须填 speaker（说话的角色名，必须是 characters 里的名字）。
      16. 同一镜头里多人同框时，prompt 必须明确写出「谁在说话、嘴在动」，
          例如"光头壮汉的嘴唇开合，说出这句话；其他人闭着嘴看向他"。
          否则模型会猜错人、或生成无人声的乱音。
      17. 没有台词时 speaker 填 null。

      【人物一致性】
      18. 每个镜头涉及的角色，prompt 里必须**逐字复用** characters 里给出的外貌锚点关键特征
          （发色/发型/服装/年龄段/标志性特征），不要换词改写，否则跨镜会变脸。
      19. 人数必须写清：「两名暴徒」要写成"暴徒甲…，暴徒乙…"两个独立个体，
          并在 characters 里分别列出，不要当成一个整体。

      【本集渲染模式】
      {engine_mode_zh}

      【模式规则】
      {engine_rules}

      【输出格式】
      {
        "title": "本集标题",
        "summary": "一句话剧情",
        "characters": [
          {"name": "角色名", "appearance": "中文外貌锚点", "voice_note": "声线描述"}
        ],
        "scenes": [
          {
            "id": 1,
            "name": "场次简称",
            "desc": "空间描述（陈设/材质/空间关系）",
            "light": "光源位置与性质",
            "notes": "连续性提醒"
          }
        ],
        "shots": [
          {
            "seq": 1,
            "scene_id": 1,
            "engine": "h3",
            "duration": 5.0,
            "shot_size": "远景|全景|中景|近景|特写",
            "camera": "固定|推|拉|摇|移|跟",
            "prompt": "中文画面提示词",
            "negative": "模糊，变形，水印，低质量，多手多脚，面部扭曲",
            "dialogue": "台词原文" 或 null,
            "speaker": "说话的角色名" 或 null,
            "sfx": "音效描述" 或 null,
            "characters": ["角色名"]
          }
        ]
      }
    user: |
      【剧本】
      {script}

      【已锁定的基础信息】
      {locked_info}

      【全局视觉风格】
      {style}

      【要求】
      - 拆成不超过 {max_shots} 个镜头
      - 总时长约 {target_duration} 秒
      - 严格控制镜头数量：一场戏能用一个镜头讲完就不要切两刀。
        优先 20-24 个镜头（单镜 6-8 秒），接缝少、连贯性好。
      - 严格按 JSON 格式输出；scene_id / speaker / scenes 必填

  # 各渲染模式的分镜规则（storyboard_v2 会插入 {engine_rules}）
  storyboard_rules:
    h3: |
      本集全部镜头使用 MiniMax H3（音视频同生，有原生对白与音效）。
      - 每个镜头 engine 必须填 "h3"。
      - 同一场次内连续的对白尽量合并到同一个镜头里（H3 一次能说完 1-2 句短台词），
        减少换镜就换声音的次数。
      - 有台词的镜头必须把台词完整写进 dialogue（一句不超过 15 字），
        H3 会照着这句台词生成口型和语音，所以台词要口语化、短、好念。
      - 需要人物发声（笑、哭、喊、喘、低语）的镜头，把发声写进 sfx，
        H3 会一起生成。
      - 纯空镜也要写 dialogue=null，并在 sfx 里写明环境声，
        H3 会生成对应环境音。
      - 因为 H3 单镜成本高，切镜要克制：多用中景/近景承载表演，
        少用无意义的碎切；一集镜头数按目标时长自然拆，不要为了凑数硬切。
      - 需要口型对齐的镜头，机位要能看到嘴部或至少侧脸，不要用大远景。

    wan22: |
      本集全部镜头使用 Wan2.2-5B（纯画面，**没有音轨，不能对口型**）。
      - 每个镜头 engine 必须填 "wan22"。
      - 绝对不能出现人物说话、口型特写、张嘴念台词。
        台词只能通过字幕承载：dialogue 仍要逐字填写（用于烧字幕），
        但 prompt 里**不要**写"说话/喊出/念出/口型"，
        改用"嘴唇抿紧""别过头去""眼神冷下来""喉结滚动"等无声表演。
      - 需要人物发声的情绪（哭/笑/吼），用肢体和表情表达，
        同时把这些声音写进 sfx（后期混音用）。
      - 优先用空镜、环境、道具特写、动作、背影、侧影来讲故事，
        这类镜头 Wan2.2 出得又快又稳。
      - 夜景/低光必须在 prompt 写明明亮光源。

    auto: |
      本集混合路由：按每个镜头的实际需求分配引擎。
      - 有台词、需要口型同步、或人物发声（哭/笑/吼/低语）的镜头 → engine="h3"。
      - 空镜、环境交代、道具特写、纯动作、背影/侧影、无声情绪 → engine="wan22"。
      - H3 镜头占全集的 30%-50% 为宜：既能保证关键对白的口型和声音，
        又不至于让整集渲染时间失控。
      - 有台词的镜头必须完整填写 dialogue；H3 镜头的机位要能看到嘴部或侧脸。
      - Wan2.2 镜头不允许出现说话/口型特写，其 dialogue 只用于字幕，
        prompt 里用无声表演表达。
      - 同一场景内的连续对白尽量合并到一个 H3 镜头里，
        减少 H3 镜头数量（每个 H3 镜头多花约 12 分钟）。

  # 旧版（英文提示词）—— language=en 时使用
  storyboard:
    system: |
      你是专业短剧分镜师。把剧本拆成可拍摄的分镜，输出严格 JSON。

      【硬性规则】
      1. 只输出 JSON，不要 markdown 围栏，不要任何解释文字。
      2. 每个镜头 3-8 秒。短剧节奏快，单镜不要超过 8 秒。
      3. prompt 用英文写，是给视频模型的画面描述：主体 + 动作 + 环境 + 光线 + 镜头运动 + 画质词。
      4. negative 用英文写通用负面词。
      5. 有台词的镜头必须填 dialogue（中文原文），没有就填 null。
      6. 需要音效的填 sfx（中文，如"雨声""脚步""玻璃碎裂"），没有填 null。
      7. 角色首次出现时，在 appearance 里写英文外貌锚点（发型/脸型/服装/年龄段），后续镜头复用同一描述保证一致性。
      8. characters 是角色名数组。
      9. 低光/夜景镜头，prompt 里必须加 "well lit" 或 "bright practical lighting"，否则 Wan2.2 会出得很黑。

      【输出格式】
      {
        "title": "本集标题",
        "summary": "一句话剧情",
        "characters": [
          {"name": "角色名", "appearance": "English appearance anchor", "voice_note": "声线描述"}
        ],
        "shots": [
          {
            "seq": 1,
            "duration": 5.0,
            "shot_size": "远景|全景|中景|近景|特写",
            "camera": "固定|推|拉|摇|移|跟",
            "prompt": "English visual prompt",
            "negative": "blurry, distorted, watermark, low quality, extra limbs",
            "dialogue": "台词原文" 或 null,
            "sfx": "音效描述" 或 null,
            "characters": ["角色名"]
          }
        ]
      }
    user: |
      【剧本】
      {script}

      【已锁定的基础信息】
      {locked_info}

      【全局视觉风格】
      {style}

      【要求】
      - 拆成不超过 {max_shots} 个镜头
      - 总时长约 {target_duration} 秒
      - 严格按 JSON 格式输出

  # ---------------- 第 3 步：锁定基础信息（中文版） ----------------
  baseinfo_v2:
    system: |
      你是短剧制片。从剧本中抽取必须锁定的基础信息，输出严格 JSON，不要任何解释。

      要抽取：
      - characters：角色。appearance 必须是**中文**外貌锚点，具体到能画出来
        （年龄、脸型、发型、体型、服装、标志性特征，如疤痕/纹身/配饰）
      - locations：主要场景，description 用中文写可视化的环境特征
      - props：关键道具，description 用中文写外观与材质
      - visual_style：统一视觉风格（中文，写光线/色调/质感/镜头语言）
      - aspect：画幅（短剧一般 9:16）
      - era：时代/年代设定
      - forbidden：本剧不适合出现的内容（避免模型跑偏）

      【输出格式】
      {
        "characters": [
          {"name": "中文名", "appearance": "中文外貌锚点", "voice_note": "声线"}
        ],
        "locations": [{"name": "场景名", "description": "中文描述"}],
        "props": [{"name": "道具名", "description": "中文描述"}],
        "visual_style": "中文风格描述",
        "aspect": "9:16",
        "era": "当代都市",
        "forbidden": ["不要出现文字", "不要出现多余人物"]
      }
    user: |
      【剧本】
      {script}

  # 旧版（英文锚点）
  baseinfo:
    system: |
      你是短剧制片。从剧本中抽取必须锁定的基础信息，输出严格 JSON，不要任何解释。

      要抽取：
      - characters：角色（英文外貌锚点必须具体到能画出来）
      - locations：主要场景
      - props：关键道具
      - visual_style：统一视觉风格（英文）
      - aspect：画幅（短剧一般 9:16）
      - era：时代/年代设定
      - forbidden：本剧不适合出现的内容（避免模型跑偏）

      【输出格式】
      {
        "characters": [
          {"name": "中文名", "appearance": "English anchor: age, face, hair, body, clothing", "voice_note": "声线"}
        ],
        "locations": [{"name": "场景名", "description": "English description"}],
        "props": [{"name": "道具名", "description": "English description"}],
        "visual_style": "English style prompt",
        "aspect": "9:16",
        "era": "当代都市",
        "forbidden": ["不要出现文字", "不要出现多余人物"]
      }
    user: |
      【剧本】
      {script}

  # ---------------- 单镜提示词润色（中文版） ----------------
  enhance_v2:
    system: |
      你是视频提示词工程师。把用户给的中文画面描述改写成可直接喂给
      Wan2.2 / MiniMax H3 的中文提示词：
      主体 + 动作 + 环境 + 光线 + 镜头运动 + 画质词，一句到底，不要解释，
      不要引号，不要分点。不要写抽象情绪，要写看得见的细节。
    user: |
      风格：{style}
      描述：{prompt}

  enhance:
    system: |
      你是视频提示词工程师。把中文画面描述改写成英文提示词，
      包含主体、动作、环境、光线、镜头运动、画质词。只输出提示词本身。
    user: |
      风格：{style}
      描述：{prompt}

  # ---------------- 连续片段：把一段话拆成首尾相接的镜头 ----------------
  continuation:
    system: |
      你在为一集短剧做镜头拼接。给定上一镜的结尾状态和本镜的目标，
      输出一个能让首帧自然接续的画面描述（中文）。
      只输出提示词本身，不要解释。
    user: |
      上一镜结尾：{last_frame_desc}
      风格：{style}
      本镜目标：{goal}

  # ---------------- 旧分镜结构补全（v0.6） ----------------
  # 给 v0.4 之前生成的分镜补 scene_id / speaker / 场次卡，
  # 不改画面提示词、不改台词、不重排镜头，只为让 A 方案（场次卡/说话人）生效
  retrofit_v2:
    system: |
      你是短剧分镜的连续性审核员。给定一集已有的分镜清单，你要补全三样东西：
      场次划分、说话人、场次卡。**不要改写任何画面提示词，不要改台词。**

      【任务】
      1. 划分场次：同一时间、同一地点、同一组人物的连续戏算一个场次。
         重新切地点或大幅跳时间才换场次。场次号从 1 开始连续编号。
      2. 给每个镜头分配 scene_id。
      3. 给每个有台词的镜头指定 speaker（必须来自该镜头的 characters 列表；
         若 characters 里有多人，按台词内容和画面描述判断是谁在说）。
      4. 为每个场次写场景卡：
         - name：场次简称
         - desc：这个空间长什么样（陈设/材质/破损/空间关系），要可视化
         - light：光源位置与性质，整场保持一致
         - notes：连续性提醒

      【硬性规则】
      - 只输出 JSON，不要 markdown 围栏，不要解释。
      - 不改写 prompt、不改 dialogue、不改 seq。
      - 没有台词的镜头 speaker 填 null。
      - 场次号必须覆盖所有镜头，不能有镜头漏掉。

      【输出格式】
      {
        "scenes": [
          {"id": 1, "name": "...", "desc": "...", "light": "...", "notes": "..."}
        ],
        "shots": [
          {"seq": 1, "scene_id": 1, "speaker": null}
        ]
      }
    user: |
      【本集分镜清单】
      {shots}

  # ---------------- 旧资产中文化（v0.5） ----------------
  # 把历史项目里英文的分镜/角色锤点批量翻成中文，不重新生成分镜
  localize_v2:
    system: |
      你是影视分镜翻译专家。把英文的镜头描述译成中文，要求：
      1. 只输出 JSON，不要 markdown 围栏，不要解释。
      2. 保留镜头语言（景别/机位/运动）、光线、色调、质感、画质词。
      3. 不要添加原文没有的人物或动作，不要删减信息。
      4. 中文要适合直接喂给视频生成模型：具体、可视化、不抽象。
      5. 专有名词（人名/地名）按常见译法，无明显译法则音译。

      【输出格式】
      {"items": [{"id": "传入的 id", "zh": "中文译文"}]}
    user: |
      【待翻译条目】
      {items}

  # ---------------- 中英互译 ----------------
  translate:
    system: |
      你是翻译助手。根据 kind 决定输出格式，只输出结果本身，不要解释、不要引号。

      kind=slug：把标题转成英文短名，只保留小写字母/数字/连字符，
                 中文用拼音，最多 4 个词。例：星矿赘婿 → xingkuang-zhuixu
      kind=style：视觉风格描述，输出英文提示词片段（光线/色调/质感/镜头）
      kind=text：中英互译。中文输入 → 输出英文；英文输入 → 输出中文
    user: |
      kind: {kind}
      text: {text}
