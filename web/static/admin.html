<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SDF · 后台管理</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#2a3240;
  --text:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --ok:#3fb950;
  --warn:#d29922; --err:#f85149; --h3:#a371f7; --wan:#2ea043;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--accent);text-decoration:none}
button{font:inherit;cursor:pointer;border:none;border-radius:6px;padding:8px 16px;
  background:var(--accent);color:#fff;transition:.15s}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
button.danger{background:var(--err)}
button.sm{padding:4px 10px;font-size:12px}
input,textarea,select{font:inherit;background:var(--bg);color:var(--text);
  border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
textarea{resize:vertical;font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px;line-height:1.5}
label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}

header{display:flex;align-items:center;gap:16px;padding:12px 20px;
  background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
header h1{font-size:16px;font-weight:600}
header h1 span{color:var(--accent)}
.back-link{font-size:13px;color:var(--dim);padding:5px 12px;border:1px solid var(--line);
  border-radius:6px;text-decoration:none;white-space:nowrap;transition:.15s}
.back-link:hover{color:var(--text);border-color:var(--accent);background:var(--panel2)}
.sysbar{display:flex;gap:16px;margin-left:auto;font-size:12px;color:var(--dim);flex-wrap:wrap}
.sysbar b{color:var(--text)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--err)} .dot.warn{background:var(--warn)}

.layout{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 57px)}
nav{background:var(--panel);border-right:1px solid var(--line);padding:12px 8px}
nav .item{padding:9px 14px;border-radius:6px;cursor:pointer;font-size:13px;
  color:var(--dim);margin-bottom:2px;transition:.12s}
nav .item:hover{background:var(--panel2);color:var(--text)}
nav .item.active{background:var(--panel2);color:var(--text);font-weight:600}
nav .item .ico{display:inline-block;width:18px;opacity:.8}
main{padding:20px;overflow-x:auto}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:16px;margin-bottom:16px}
.card h2{font-size:14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h2 .tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--panel2);color:var(--dim);font-weight:400}

.row{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap}
.row>div{flex:1;min-width:180px}
.row .fixed{flex:0 0 auto;min-width:auto}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;white-space:nowrap}
td{vertical-align:top}
tr:hover td{background:rgba(255,255,255,.02)}

.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
.pill.ok,.pill.done{background:#12351f;color:var(--ok)}
.pill.bad,.pill.failed{background:#3d1418;color:var(--err)}
.pill.warn,.pill.running{background:#3d2f00;color:var(--warn)}
.pill.dim{background:#30363d;color:var(--dim)}
.pill.h3{background:rgba(163,113,247,.18);color:var(--h3)}
.pill.wan22{background:rgba(46,160,67,.18);color:var(--wan)}

.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel2);border-radius:6px;padding:12px}
.stat .v{font-size:20px;font-weight:600}
.stat .k{font-size:11px;color:var(--dim)}

.log{background:#010409;border:1px solid var(--line);border-radius:6px;
  padding:10px;font-family:ui-monospace,monospace;font-size:12px;
  max-height:420px;overflow:auto;line-height:1.65;white-space:pre-wrap;word-break:break-all}

.hint{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.5}
.hint code{background:var(--panel2);padding:1px 5px;border-radius:3px;font-family:ui-monospace,monospace}

.toast{position:fixed;bottom:24px;right:24px;background:var(--panel2);
  border:1px solid var(--line);border-left:3px solid var(--accent);
  padding:12px 18px;border-radius:6px;font-size:13px;z-index:100;
  opacity:0;transform:translateY(10px);transition:.25s;max-width:420px}
.toast.show{opacity:1;transform:translateY(0)}
.toast.err{border-left-color:var(--err)}
.toast.ok{border-left-color:var(--ok)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{padding:7px 14px;cursor:pointer;color:var(--dim);font-size:13px;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}

.switch{position:relative;display:inline-block;width:38px;height:20px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#30363d;border-radius:10px;transition:.2s}
.slider:before{position:absolute;content:"";height:14px;width:14px;left:3px;bottom:3px;
  background:#fff;border-radius:50%;transition:.2s}
input:checked+.slider{background:var(--ok)}
input:checked+.slider:before{transform:translateX(18px)}

.mono{font-family:ui-monospace,monospace;font-size:12px}
.muted{color:var(--dim)}
.flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:20px;width:min(620px,100%);max-height:88vh;overflow-y:auto;
  box-shadow:0 16px 48px rgba(0,0,0,.6)}
.modal h3{font-size:15px;margin-bottom:6px}
.modal .row>div{min-width:150px}
</style>
</head>
<body>

<header>
  <h1>⚙️ SDF <span>后台管理</span></h1>
  <a href="/" class="back-link" title="返回创作界面">← 返回前台</a>
  <div class="sysbar" id="sysbar"></div>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main"><div class="muted">加载中…</div></main>
</div>

<div class="toast" id="toast"></div>

<script>
// 按业务流程排序：
//   1 总览(看状态) → 2 接后端(ComfyUI) → 3 装模型 → 4 配 LLM/提示词
//   → 5 调渲染(引擎/路由) → 6 定风格平台 → 7 系统设置 → 8 数据与诊断
const SECTIONS = [
  ['overview','📊','总览'],
  ['comfy',   '🔌','ComfyUI 对接'],
  ['models',  '🧩','模型接入'],
  ['prompts', '✍️','LLM 与提示词'],
  ['engines', '⚙','引擎参数'],
  ['routing', '🚦','路由策略'],
  ['presets', '🎨','风格与平台'],
  ['secrets', '🔑','API KEY'],
  ['settings','🛠','设置项'],
  ['files',   '📁','文件管理'],
  ['config',  '📝','配置文件'],
  ['tasks',   '📋','任务日志'],
];
let state = { section:'overview', data:{} };

// 配置字段中文名（后台表单用；找不到就显示原名）
const FIELD_ZH = {
  app:'应用', name:'名称', version:'版本',
  render:'渲染', max_concurrent:'最大并发', shot_timeout_sec:'单镜超时(秒)',
  poll_interval_sec:'轮询间隔(秒)', free_vram_before_shot:'每镜前释放显存',
  cooldown_between_shots_sec:'镜头间冷却(秒)', max_retries:'最大重试次数',
  paths:'路径', output_dir:'产物目录', input_dir:'输入目录',
  workflows_dir:'工作流目录', data_dir:'数据目录',
  comfy:'ComfyUI', base_url:'后端地址', request_timeout_sec:'请求超时(秒)',
  submit_timeout_sec:'提交超时(秒)', wait_timeout_sec:'等待上限(秒)',
  storage:'存储', keep_shot_fragments:'保留单镜片段',
  cleanup_workdir_after_assemble:'成片后清理中间目录',
  assemble:'成片', width:'宽度', height:'高度', fps:'帧率', crf:'画质(CRF)',
  preset:'编码预设', threads:'编码线程', lufs:'响度(LUFS)',
  scale_mode:'缩放方式', burn_subtitles:'烧录字幕',
  ui:'界面', page_size:'每页条数', theme:'主题',
  logging:'日志', level:'级别', max_files:'保留文件数', max_size_mb:'单文件上限(MB)',
  models_dir:'模型目录',
  llm:'LLM', default_model:'默认模型', fallback_model:'降级模型',
  temperature:'温度', max_tokens:'最大token', timeout_sec:'超时(秒)',
  enabled:'启用', refresh_sec:'刷新间隔(秒)', items:'监控项',
  styles:'风格预设', platforms:'平台预设', monitor:'监控栏',
  admin:'后台安全', password:'后台密码',
};
// 配置分组中文名
const GROUP_ZH = {
  app:'应用信息', render:'渲染', paths:'路径', storage:'存储',
  assemble:'成片规格', ui:'界面', logging:'日志', admin:'后台安全',
};

function $(s){return document.querySelector(s)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m,k=''){const t=$('#toast');t.textContent=m;t.className='toast show '+k;
  clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',3000)}
function bytes(n){if(!n)return'0 B';const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]}
function ago(ts){if(!ts)return'-';const d=(Date.now()/1000)-ts;
  if(d<60)return Math.round(d)+'秒前';if(d<3600)return Math.round(d/60)+'分前';
  if(d<86400)return Math.round(d/3600)+'小时前';return new Date(ts*1000).toLocaleDateString('zh-CN')}

async function api(path, opts={}){
  const r = await fetch(path,{headers:{'Content-Type':'application/json'},...opts});
  if(!r.ok){let t=await r.text();throw new Error(t.slice(0,300))}
  return r.json();
}

// ---------- system bar ----------
async function refreshSys(){
  try{
    const s = await api('/api/admin/system');
    const g=s.gpu, m=s.memory;
    const p=[];
    if(g)p.push(`<span><span class="dot ${g.util_pct>5?'warn':'ok'}"></span>GPU <b>${(g.vram_used_mb/1024)|0}/${(g.vram_total_mb/1024)|0}GB</b>${g.temp_c!=null?` · ${g.temp_c}°C`:''}${g.power_w?` · ${g.power_w}W`:''}</span>`);
    if(m)p.push(`<span>内存 <b>${m.available_gb}GB</b> 可用${m.swap_gb==0?' <span style="color:var(--warn)">无swap</span>':''}</span>`);
    p.push(`<span><span class="dot ${s.comfy.alive?'ok':'bad'}"></span>ComfyUI</span>`);
    p.push(`<span><span class="dot ${s.llm.configured?'ok':'bad'}"></span>LLM <b>${esc(s.llm.model)}</b></span>`);
    p.push(`<span class="muted">v${esc(s.version)}</span>`);
    $('#sysbar').innerHTML=p.join('');
  }catch(e){$('#sysbar').innerHTML=`<span class="dot bad"></span>${esc(e.message)}`}
}

// ---------- nav ----------
function renderNav(){
  $('#nav').innerHTML = SECTIONS.map(([k,i,n])=>
    `<div class="item ${state.section===k?'active':''}" onclick="go('${k}')">
      <span class="ico">${i}</span>${n}</div>`).join('');
}
function go(k){ state.section=k; renderNav(); render() }

// ---------- router ----------
async function render(){
  const m=$('#main');
  try{
    if(state.section==='overview') return await renderOverview(m);
    if(state.section==='comfy') return await renderComfy(m);
    if(state.section==='settings') return await renderSettings(m);
    if(state.section==='models') return await renderModels(m);
    if(state.section==='prompts') return await renderPrompts(m);
    if(state.section==='routing') return await renderYamlSection(m,'routing','路由策略','🚦');
    if(state.section==='engines') return await renderYamlSection(m,'engines','引擎参数','⚙');
    if(state.section==='presets') return await renderPresets(m);
    if(state.section==='secrets') return await renderSecrets(m);
    if(state.section==='files') return await renderFiles(m);
    if(state.section==='config') return await renderConfigFiles(m);
    if(state.section==='tasks') return await renderTasks(m);
  }catch(e){ m.innerHTML=`<div class="card"><h2>❌ 加载失败</h2><div class="log">${esc(e.message)}</div></div>` }
}

// ---------- 总览 ----------
async function renderOverview(m){
  const s = await api('/api/admin/system');
  const cfgd = await api('/api/admin/config');
  const inv = s.models || [];
  const req = inv.filter(x=>x.required);
  const reqOk = req.filter(x=>x.complete).length;
  const g=s.gpu, mem=s.memory, dk=s.disk;

  m.innerHTML = `
  <div class="card"><h2>平台状态 <span class="tag">v${esc(s.version)}</span></h2>
    <div class="grid4">
      <div class="stat"><div class="v">${g?((g.vram_used_mb/1024).toFixed(1)):'-'}</div><div class="k">显存占用 GB</div></div>
      <div class="stat"><div class="v">${g&&g.temp_c!=null?g.temp_c:'-'}</div><div class="k">GPU 温度 °C</div></div>
      <div class="stat"><div class="v">${mem?mem.available_gb:'-'}</div><div class="k">可用内存 GB</div></div>
      <div class="stat"><div class="v">${dk?dk.free_gb:'-'}</div><div class="k">磁盘可用 GB</div></div>
      <div class="stat"><div class="v">${reqOk}/${req.length}</div><div class="k">必需模型</div></div>
      <div class="stat"><div class="v">${s.stats.total}</div><div class="k">镜头总数</div></div>
    </div>
  </div>

  <div class="card"><h2>模型完整性</h2>
    <table><thead><tr><th>模型</th><th>类型</th><th>期望</th><th>实际</th><th>状态</th></tr></thead>
    <tbody>${inv.map(x=>`<tr>
      <td>${esc(x.name)}<div class="muted mono">${esc(x.file)}</div></td>
      <td><span class="pill ${x.engine}">${esc(x.engine)}</span></td>
      <td class="mono">${x.size_gb} GB</td>
      <td class="mono">${x.present?x.actual_gb+' GB':'-'}</td>
      <td>${x.complete?'<span class="pill ok">完整</span>':
           x.present?'<span class="pill warn">大小不符</span>':
           '<span class="pill '+(x.required?'bad':'dim')+'">缺失</span>'}</td>
    </tr>`).join('')}</tbody></table>
  </div>

  <div class="card"><h2>配置与密钥</h2>
    <table><thead><tr><th>文件</th><th>路径</th><th>大小</th><th>更新时间</th></tr></thead>
    <tbody>${cfgd.files.map(f=>`<tr>
      <td class="mono">${esc(f.name)}</td>
      <td class="muted mono">${esc(f.path)}</td>
      <td class="mono">${f.exists?bytes(f.size):'<span class="pill bad">缺失</span>'}</td>
      <td class="muted">${f.mtime?ago(f.mtime):'-'}</td>
    </tr>`).join('')}</tbody></table>
    <div class="hint">所有配置都在 <code>${esc(files_root_hint())}</code> 下，可直接改文件后点「重载配置」。</div>
    <div class="flex" style="margin-top:12px">
      <button class="ghost" onclick="reloadCfg()">↻ 重载全部配置</button>
      <button class="ghost" onclick="testLLM()">🧪 测试 LLM</button>
    </div>
  </div>`;
}
function files_root_hint(){ return '/mnt/disks/nvme/docker/compose/sdf/config' }

async function reloadCfg(){
  try{ const r=await api('/api/admin/config/reload',{method:'POST'});
    toast('已重载: '+r.snapshot_keys.join(', '),'ok'); render();
  }catch(e){toast('重载失败: '+e.message,'err')}
}
async function testLLM(){
  toast('测试中…');
  try{ const r=await api('/api/admin/llm/test');
    toast(r.ok?`✅ LLM 正常 ${r.latency_ms}ms`:`❌ ${r.error}`, r.ok?'ok':'err');
  }catch(e){toast(e.message,'err')}
}

// ---------- ComfyUI 对接 ----------
async function renderComfy(m){
  const d = await api('/api/admin/comfy');
  const c = d.config || {};
  const live = d.live || {};
  const ok = !!live.alive;

  m.innerHTML = `
  <div class="card"><h2>ComfyUI 对接 <span class="tag">settings.yaml → comfy</span>
    <span class="pill ${ok?'ok':'bad'}">${ok?'在线':'离线'}</span></h2>
    <div class="hint" style="margin-bottom:14px">
      渲染后端地址。同栈用 docker 服务名 <code>http://sdf-comfyui:8188</code>；
      换机器就改成对方的 <code>http://IP:端口</code>。改完点「保存并重载」，不用重启容器。
    </div>

    <div class="row">
      <div style="flex:2"><label>后端地址 base_url</label>
        <input id="cf_url" value="${esc(c.base_url||'')}"></div>
      <div class="fixed" style="align-self:flex-end">
        <button class="ghost" onclick="testComfy()">测连通</button></div>
    </div>

    <div class="row">
      <div><label>请求超时 request_timeout（秒）</label>
        <input id="cf_req" type="number" value="${c.request_timeout_sec??30}"></div>
      <div><label>提交超时 submit_timeout（秒）</label>
        <input id="cf_sub" type="number" value="${c.submit_timeout_sec??60}"></div>
      <div><label>单镜等待上限 wait_timeout（秒）</label>
        <input id="cf_wait" type="number" value="${c.wait_timeout_sec??7200}"></div>
    </div>

    <div class="row">
      <div><label>进度轮询间隔（秒）</label>
        <input id="cf_poll" type="number" step="0.5" value="${c.poll_interval_sec??3}"></div>
      <div><label>每镜开始前释放显存</label>
        <label class="switch"><input type="checkbox" id="cf_free" ${c.free_vram_before_shot!==false?'checked':''}>
        <span class="slider"></span></label></div>
      <div></div>
    </div>

    <div class="flex" style="margin-top:14px">
      <button onclick="saveComfy()">保存并重载</button>
    </div>
    <div id="cf_out" style="margin-top:12px"></div>
  </div>

  <div class="card"><h2>实时状态</h2>
    ${ok?`
    <div class="grid4">
      <div class="stat"><div class="v">${esc(live.comfyui_version||'-')}</div><div class="k">ComfyUI 版本</div></div>
      <div class="stat"><div class="v">${esc(live.pytorch_version||'-')}</div><div class="k">PyTorch</div></div>
      <div class="stat"><div class="v">${live.ram_free_gb??'-'}</div><div class="k">可用内存 GB</div></div>
      <div class="stat"><div class="v">${(live.devices||[]).length}</div><div class="k">GPU 数</div></div>
    </div>
    ${(live.devices||[]).map(x=>`<div class="hint" style="margin-top:8px">
      ${esc(x.name)} · 显存 ${x.vram_free_gb} / ${x.vram_total_gb} GB 空闲</div>`).join('')}
    `:`<div class="log">${esc(live.error||'无法连接，请检查地址与容器状态')}</div>`}
    <div class="hint" style="margin-top:10px">实际生效地址：<code>${esc(d.effective_url)}</code></div>
  </div>`;
}

window.testComfy=async function(){
  const url=$('#cf_url').value.trim();
  const out=$('#cf_out'); out.innerHTML='<span class="muted">测试中…</span>';
  try{
    const r=await api('/api/admin/comfy/test',{method:'POST',body:JSON.stringify({base_url:url})});
    out.innerHTML = r.ok
      ? `<div class="pill ok">✓ 连通 ${r.latency_ms}ms · 版本 ${esc(r.comfyui_version||'?')} · GPU ${(r.devices||[]).length}</div>`
      : `<div class="pill bad">✗ ${esc(r.error||'失败')}</div>`;
  }catch(e){ out.innerHTML=`<div class="pill bad">${esc(e.message)}</div>` }
};

window.saveComfy=async function(){
  try{
    const sec = await api('/api/admin/config/settings');
    const data = sec.data || {};
    data.comfy = data.comfy || {};
    data.comfy.base_url = $('#cf_url').value.trim();
    data.comfy.request_timeout_sec = +$('#cf_req').value || 30;
    data.comfy.submit_timeout_sec = +$('#cf_sub').value || 60;
    data.comfy.wait_timeout_sec = +$('#cf_wait').value || 7200;
    data.comfy.poll_interval_sec = +$('#cf_poll').value || 3;
    data.comfy.free_vram_before_shot = $('#cf_free').checked;
    const r = await api('/api/admin/config',{method:'PUT',
      body:JSON.stringify({section:'settings',data})});
    toast('已保存'+(r.backup?`，备份 ${r.backup}`:''),'ok');
    setTimeout(()=>render(),400);

    <div class="hint" style="margin-bottom:14px">

    </div>

    <div id="sform"></div>
  </div>`;
  // comfy 有独立主菜单，设置项里不再重复出现（改动统一走 ComfyUI 对接页）
  const groups = Object.keys(s).filter(g => g !== 'comfy');
  const st = $('#stab');
  st.innerHTML = groups.map((g,i)=>`<div class="tab ${i===0?'active':''}" onclick="pickGroup('${g}',this)">${GROUP_ZH[g]||g}</div>`).join('');
  window._settings = s; window._group = groups[0];
  drawGroup(groups[0]);

window.pickGroup=function(g,el){
  document.querySelectorAll('#stab .tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active'); window._group=g; drawGroup(g);
};
function drawGroup(g){
  const s=window._settings[g]||{};
  const f=$('#sform');
  f.innerHTML = Object.entries(s).map(([k,v])=>fieldRow(k,v,g)).join('') +
    `<button onclick="saveSettings()" style="margin-top:8px">保存「${GROUP_ZH[g]||g}」</button>`;
}
function fieldRow(k,v,g){
  const id=`f_${g}_${k}`;
  const zh=FIELD_ZH[k]||'';
  const lbl=zh?`${zh}<span class="muted" style="font-weight:400"> / ${k}</span>`:k;
  if(typeof v==='boolean')
    return `<div class="row"><div><label>${lbl}</label>
      <label class="switch"><input type="checkbox" id="${id}" ${v?'checked':''}><span class="slider"></span></label></div></div>`;
  if(typeof v==='number')
    return `<div class="row"><div><label>${lbl}</label>
      <input type="number" step="any" id="${id}" value="${v}"></div></div>`;
  if(typeof v==='object'&&v!==null)
    return `<div class="row"><div><label>${lbl}（JSON）</label>
      <textarea id="${id}" rows="4">${esc(JSON.stringify(v,null,2))}</textarea></div></div>`;
  return `<div class="row"><div><label>${lbl}</label>
    <input type="text" id="${id}" value="${esc(v)}"></div></div>`;
}
window.saveSettings=async function(){
  const g=window._group, s=JSON.parse(JSON.stringify(window._settings));
  for(const [k,v] of Object.entries(s[g])){
    const el=document.getElementById(`f_${g}_${k}`); if(!el)continue;
    if(typeof v==='boolean') s[g][k]=el.checked;
    else if(typeof v==='number') s[g][k]=el.value===''?null:Number(el.value);
    else if(typeof v==='object'&&v!==null){
      try{s[g][k]=JSON.parse(el.value)}catch(e){return toast(`${k} 不是合法 JSON`,'err')}
    } else s[g][k]=el.value;
  }
  try{
    const r=await api('/api/admin/config',{method:'PUT',
      body:JSON.stringify({section:'settings',data:s})});
    toast('已保存'+(r.backup?`，备份 ${r.backup}`:''),'ok');
  }catch(e){toast('保存失败: '+e.message,'err')}
};

window.doDownload = async function(){
  const src = document.getElementById('dl_src').value;
  const body = {
    source: src,
    repo: (document.getElementById('dl_repo')||{}).value || '',
    file: (document.getElementById('dl_file')||{}).value || '',

  };
  const out = document.getElementById('dl_out');
  out.innerHTML = '<span class="muted">提交中…</span>';
  try{

      body:JSON.stringify(body)});
    out.innerHTML = `<div class="hint">已开始<br>
      <span class="mono" style="font-size:11px">${esc(r.url)}</span><br>
      → <span class="mono">${esc(r.target)}</span></div>
      <div class="log" style="max-height:140px;margin-top:8px" id="dl_log">下载中…</div>`;
    watchDownload(r.task_id);
  }catch(e){
    out.innerHTML = `<div class="pill bad">${esc(e.message)}</div>`;
  }

async function watchDownload(tid){
  const box = () => document.getElementById('dl_log');
  for(let i=0;i<720;i++){
    await new Promise(r=>setTimeout(r,5000));
    let t;
    try{ t = await api('/api/tasks/'+tid) }catch(e){ return }
    const b = box();
    if(b){
      const ev=(t.progress||[]).slice(-1)[0]||{};
      b.textContent = `${t.status}  ${ev.phase||''}  ${ev.status||''}`;
    }
    if(t.status!=='running'){
      const res=t.result||{};
      toast(t.status==='done'
        ? `下载完成：${res.target||''} ${res.size_gb||''}GB`
        : `下载失败：${(t.error||'').slice(0,80)}`,
        t.status==='done'?'ok':'err');
      render();
      return;
    }
  }
}

let FILES_CACHE={scope:'output',items:[]};

window.pickFiles=async function(scope,el){
  document.querySelectorAll('#ftab .tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const box=$('#flist'); box.innerHTML='加载中…';
  try{
    const d=await api('/api/admin/files?scope='+scope);
    FILES_CACHE={scope, items:d.items||[], root:d.root, total:d.total_bytes};
    $('#fStat').textContent=`${d.root} · ${d.count} 个文件 · 共 ${bytes(d.total_bytes)}`;
    filterFiles();
  }catch(e){ box.innerHTML=`<div class="log">${esc(e.message)}</div>` }
};

window.filterFiles=function(){
  const box=$('#flist'); if(!box) return;
  const q=(($('#fSearch')||{}).value||'').toLowerCase();
  const kind=(($('#fKind')||{}).value||'');
  const scope=FILES_CACHE.scope;
  let items=(FILES_CACHE.items||[]);
  if(q) items=items.filter(f=>(f.path||'').toLowerCase().includes(q));
  if(kind) items=items.filter(f=>f.kind===kind);
  if(!items.length){ box.innerHTML='<div class="muted">没有匹配的文件</div>'; return }
  const show=items.slice(0,600);
  box.innerHTML=`
    <div class="hint" style="margin-bottom:8px">
      点击「预览」直接看视频/图片/文本；「下载」保存到本地。共 ${items.length} 个匹配${items.length>600?'（只显示前 600）':''}。
    </div>
    <table><thead><tr><th>路径</th><th>类型</th><th>大小</th><th>修改</th><th>操作</th></tr></thead>
    <tbody>${show.map(f=>`<tr>
      <td class="mono" style="font-size:11.5px;word-break:break-all">${esc(f.path)}</td>
      <td><span class="pill ${f.kind==='video'?'done':f.kind==='image'?'h3':f.kind==='text'?'dim':'warn'}">${f.kind}</span></td>
      <td class="mono">${bytes(f.size)}</td>
      <td class="muted" style="font-size:12px">${ago(f.mtime)}</td>
      <td style="white-space:nowrap">
        <button class="sm ghost" onclick="previewFile('${scope}','${esc(f.path).replace(/'/g,"\\'")}')">预览</button>
        <a class="sm" style="padding:4px 10px;border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--text);font-size:12px"
          href="/api/admin/file?scope=${scope}&download=true&path=${encodeURIComponent(f.path)}">下载</a>
        ${scope!=='config'?`<button class="sm ghost" onclick="delFile('${scope}','${esc(f.path).replace(/'/g,"\\'")}')">🗑</button>`:''}
      </td>
    </tr>`).join('')}</tbody></table>`;
};

window.previewFile=async function(scope,path){
  document.querySelectorAll('.modal-mask').forEach(n=>n.remove());
  const url=`/api/admin/file?scope=${scope}&path=${encodeURIComponent(path)}`;
  let meta=null;
  try{ meta=await api(`/api/admin/file/meta?scope=${scope}&path=${encodeURIComponent(path)}`) }catch(e){}
  const kind=meta?meta.kind:'binary';
  const dl=`/api/admin/file?scope=${scope}&download=true&path=${encodeURIComponent(path)}`;
  let body='';
  if(kind==='video'){
    body=`<div style="background:#000;border-radius:6px;overflow:hidden">
      <video src="${url}" controls autoplay style="max-width:100%;max-height:65vh;display:block;margin:0 auto"></video></div>`;
  }else if(kind==='image'){
    body=`<div style="background:#000;border-radius:6px;text-align:center">
      <img src="${url}" style="max-width:100%;max-height:65vh"></div>`;
  }else if(kind==='audio'){
    body=`<audio src="${url}" controls style="width:100%"></audio>`;
  }else if(kind==='text'){
    try{
      const d=await fetch(url).then(r=>r.json());
      body=`<div class="log" style="max-height:60vh">${esc(d.content||'')}</div>
        ${d.truncated?'<div class="hint">文件较大，仅显示前 400KB，下载看全文。</div>':''}`;
    }catch(e){ body=`<div class="log">读取失败：${esc(e.message)}</div>` }
  }else{
    body=`<div class="muted">该类型不支持在线预览，请下载后用本地工具打开。</div>`;
  }
  const mask=document.createElement('div');
  mask.className='modal-mask';
  mask.innerHTML=`<div class="modal" style="width:min(900px,100%)">
    <h3 style="word-break:break-all">${esc(path.split('/').pop())}</h3>
    <div class="hint" style="margin-bottom:10px">
      ${esc(scope)} · ${meta?bytes(meta.size):''} ${meta?'· '+ago(meta.mtime):''}
    </div>
    ${body}
    <div class="flex" style="margin-top:14px">
      <a class="sm" style="padding:8px 16px;border-radius:6px;background:var(--accent);color:#fff;text-decoration:none"
        href="${dl}">⬇ 下载</a>
      <button class="ghost" onclick="this.closest('.modal-mask').remove()">关闭</button>
    </div>
  </div>`;
  document.body.append(mask);
};

    <table><thead><tr><th>类型</th><th>状态</th><th>开始</th><th>进度</th></tr></thead>
    <tbody>${(tasks.tasks||[]).slice(0,20).map(t=>{
      const last=(t.progress||[]).slice(-1)[0]||{};
      return `<tr>
        <td>${esc(t.kind)}</td>
        <td><span class="pill ${t.status}">${esc(t.status)}</span></td>
        <td class="muted">${ago(t.started)}</td>
        <td class="mono muted" style="font-size:11px">${esc(JSON.stringify(last).slice(0,120))}</td>
      </tr>`}).join('')||'<tr><td colspan="4" class="muted">无</td></tr>'}</tbody></table>
  </div>

  <div class="card"><h2>渲染队列 <span class="tag">跨集串行</span>
    <span class="flex" style="margin-left:auto;gap:6px">
      <button class="sm ghost" onclick="qCtl('pause')">暂停</button>
      <button class="sm ghost" onclick="qCtl('resume')">恢复</button>
      <button class="sm ghost" onclick="qCtl('clear_finished')">清理已完成</button>
    </span></h2>
    <div id="qbox" class="muted">加载中…</div>
  </div>

  <div class="card"><h2>渲染历史 <span class="tag">job 表</span></h2>
    <table><thead><tr><th>镜</th><th>引擎</th><th>状态</th><th>耗时</th><th>错误</th></tr></thead>
    <tbody>${(jobs.jobs||[]).map(j=>{
      const dur = j.started_at&&j.finished_at ? ((j.finished_at-j.started_at)/60).toFixed(1)+'分' : '-';
      return `<tr>
        <td class="mono">${j.shot_seq!=null?j.shot_seq:'-'}</td>
        <td><span class="pill ${j.engine||''}">${esc(j.engine||'-')}</span></td>
        <td><span class="pill ${j.status}">${esc(j.status)}</span></td>
        <td class="mono">${dur}</td>
        <td class="muted" style="font-size:11px">${esc((j.error||'').slice(0,80))}</td>
      </tr>`}).join('')||'<tr><td colspan="5" class="muted">无</td></tr>'}</tbody></table>
  </div>`;
  renderQ();
}

async function renderQ(){
  const box=$('#qbox'); if(!box) return;
  try{
    const d=await api('/api/queue?limit=50');
    const c=d.consumer||{}, cnt=d.counts||{};
    const items=d.items||[];
    const QST={queued:'排队中',running:'渲染中',done:'已完成',failed:'失败',canceled:'已取消'};
    box.innerHTML=`
      <div class="hint" style="margin-bottom:8px">
        消费者：<b>${c.consumer_alive?'运行中':'未运行'}</b>${c.paused?' · <span style="color:var(--warn)">已暂停</span>':''}
        · 排队 ${cnt.queued||0} · 运行 ${cnt.running||0} · 完成 ${cnt.done||0} · 失败 ${cnt.failed||0}
        · 单卡串行（同一时刻只跑一集）
      </div>
      ${items.length?`<table><thead><tr><th>集</th><th>项目/剧集</th><th>模式</th><th>镜头</th><th>状态</th><th>开始</th><th>产物</th></tr></thead>
      <tbody>${items.map(it=>`<tr>
        <td class="mono">E${it.seq||''}</td>
        <td><div style="font-size:12.5px">${esc(it.project_title||'')}</div>
            <div class="muted" style="font-size:11px">${esc(it.episode_title||'')}</div></td>
        <td class="muted" style="font-size:11.5px">${esc(it.engine_mode||'auto')}</td>
        <td class="mono" style="font-size:11.5px">${it.shots_done||0}/${it.shots_total||0}</td>
        <td><span class="pill ${it.status}">${QST[it.status]||it.status}</span>
            ${it.error?`<div class="muted" style="color:var(--err);font-size:10.5px">${esc(String(it.error).slice(0,60))}</div>`:''}</td>
        <td class="muted" style="font-size:11.5px">${it.started_at?ago(it.started_at):'-'}</td>
        <td class="mono muted" style="font-size:11px;word-break:break-all">${esc((it.output||'').split('/').slice(-2).join('/'))}</td>
      </tr>`).join('')}</tbody></table>`:'<div class="muted">队列为空</div>'}`;
  }catch(e){ box.innerHTML=`<div class="log">${esc(e.message)}</div>` }
}

window.qCtl=async function(action){
  try{
    const r=await api('/api/queue/control',{method:'POST',body:JSON.stringify({action})});
    toast(action==='clear_finished'?`已清理 ${r.cleared||0} 项`:'已执行','ok');
    renderQ();
  }catch(e){ toast(e.message,'err') }
};

// ---------- boot ----------
renderNav(); render(); refreshSys();
setInterval(refreshSys, 15000);
</script>
</body>
</html>
